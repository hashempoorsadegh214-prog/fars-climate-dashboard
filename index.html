<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اقلیمی استان فارس</title>
    
    <!-- Leaflet CSS - بدون ویژگی‌های امنیتی اضافی -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- استایل‌های شخصی شما -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>داشبورد اقلیمی استان فارس</h1>
        <p>تحلیل روند تغییرات دمای سالانه بر اساس مدل‌های CMIP6</p>
    </header>

    <div class="controls">
        <label for="model-select">مدل: </label>
        <select id="model-select"></select>
        
        <label for="scenario-select">سناریو: </label>
        <select id="scenario-select"></select>
    </div>

    <!-- محلی که نقشه یا نمودار شما در آن قرار می‌گیرد -->
    <div id="map" style="height: 500px; width: 100%; margin-top: 20px;"></div>

    <!-- Leaflet JS - بدون ویژگی‌های امنیتی اضافی -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- کتابخانه Chart.js (اگر از آن استفاده می‌کنید، برای رسم نمودار ضروری است) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- فایل جاوا اسکریپت شما -->
    <script src="app.js"></script>

</body>
</html>
