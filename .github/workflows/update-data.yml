name: Update Fars Climate Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update_data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install pandas requests cdsapi xarray

    - name: Create CDS API Configuration
      run: |
        echo "url: https://cds.climate.copernicus.eu/api" > ~/.cdsapirc
        echo "key: ${{ secrets.CDSAPI_KEY }}" >> ~/.cdsapirc

    - name: Fetch Fars climate data
      run: python scripts/fetch_fars.py

    - name: Commit and push new data
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add data/fars_temp.json
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update Fars climate data"
          git push
        fi
