<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اقلیمی استان فارس</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCBitSY2Xj0ak46RjYjSjvM=" crossorigin=""/>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styles if needed */
        body { font-family: 'Vazir', sans-serif; }
        .controls { margin-bottom: 20px; }
        .control-group { margin-left: 15px; display: inline-block; }
        select, button { padding: 8px 12px; margin-left: 5px; border-radius: 4px; border: 1px solid #ccc; }
        .chart-container { position: relative; height: 40vh; width: 80vw; margin: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>داشبورد اقلیمی استان فارس</h1>
        <p>تحلیل روند تغییرات دمای سالانه بر اساس مدل‌های CMIP6</p>

        <div class="controls">
            <div class="control-group">
                <label for="model-select">مدل:</label>
                <select id="model-select"></select>
            </div>
            <div class="control-group">
                <label for="scenario-select">سناریو:</label>
                <select id="scenario-select"></select>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="temperatureChart"></canvas>
        </div>

        <div id="mapid" style="height: 50vh; width: 80vw; margin: 20px auto;"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGIL2CuG1OrzVKsK0248Z+zKu0=" crossorigin=""></script>
    <!-- Your custom JavaScript -->
    <script src="app.js"></script>
</body>
</html>
