<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>داشبورد اقلیمی استان فارس</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; }
        .controls { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        #map { height: 400px; width: 100%; border: 1px solid #ccc; margin-bottom: 20px; }
        #chartWrapper { width: 100%; height: 300px; }
    </style>
</head>
<body>

    <h1>داشبورد اقلیمی استان فارس</h1>
    <div class="controls">
        <label>مدل: <select id="model-select"></select></label>
        <label>سناریو: <select id="scenario-select"></select></label>
    </div>

    <div id="map"></div>
    <div id="chartWrapper">
        <canvas id="tempChart"></canvas>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
