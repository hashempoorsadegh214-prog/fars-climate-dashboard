<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اقلیمی استان فارس</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; background: #f4f6f9; }
        h1 { text-align: center; }
        .controls { margin-bottom: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        #map { height: 400px; width: 100%; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 20px; }
        #chartWrapper { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ccc; height: 350px; }
        #status { text-align: center; color: #b00; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <h1>داشبورد اقلیمی استان فارس</h1>
    <p style="text-align:center;">تحلیل روند تغییرات دما بر اساس داده‌های CMIP6</p>

    <div class="controls">
        <label>مدل: <select id="model-select"></select></label>
        <label>سناریو: <select id="scenario-select"></select></label>
    </div>

    <div id="status"></div>

    <div id="map"></div>

    <div id="chartWrapper">
        <canvas id="tempChart"></canvas>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
