<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد اقلیم استان فارس | Copernicus CMIP6</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h1 { color: #1a365d; text-align: center; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 25px; }
    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    #map { height: 400px; border-radius: 8px; border: 1px solid #ddd; }
    .chart-box { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
  </style>
</head>
<body>

<div class="container">
  <h1>داشبورد تعاملی اقلیم استان فارس</h1>
  <p class="subtitle">داده‌های روند دمایی CMIP6 (سناریوی SSP2-4.5) - منبع: Copernicus Climate Change Service</p>
  
  <div class="grid">
    <div>
      <h3>موقعیت استان فارس</h3>
      <div id="map"></div>
    </div>
    <div class="chart-box">
      <h3>روند تغییرات دمای سالانه (تاریخی و پیش‌بینی)</h3>
      <canvas id="climateChart"></canvas>
    </div>
  </div>
</div>

<script>
  // ۱. تنظیم نقشه
  const map = L.map('map').setView([29.61, 52.53], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // محدوده استان فارس
  const farsBounds = [[29.0, 50.5], [31.7, 50.5], [31.7, 55.8], [29.0, 55.8]];
  L.polygon(farsBounds, {color: '#d9534f', weight: 2, fillOpacity: 0.2}).addTo(map)
   .bindPopup("<b>محدوده مطالعاتی: استان فارس</b>");

  // ۲. دریافت داده و رسم نمودار
  fetch('data/fars_temp.json')
    .then(res => res.json())
    .then(data => {
      const ctx = document.getElementById('climateChart').getContext('2d');
      
      // تفکیک رنگ برای تاریخی و آینده
      const colors = data.years.map(y => y <= 2020 ? '#2b6cb0' : '#dd6b20');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.years,
          datasets: [{
            label: 'میانگین دما (°C)',
            data: data.temperatures,
            borderColor: '#3182ce',
            pointBackgroundColor: colors,
            borderWidth: 2,
            fill: false,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: true }
          },
          scales: {
            x: { title: { display: true, text: 'سال' } },
            y: { title: { display: true, text: 'دما (سانتی‌گراد)' } }
          }
        }
      });
    })
    .catch(err => console.log('در حال بارگذاری داده‌های اولیه...'));
</script>

</body>
</html>
