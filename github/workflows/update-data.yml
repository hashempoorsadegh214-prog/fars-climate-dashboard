name: Update Fars Climate Data

on:
  schedule:
    - cron: '0 2 1 * *' # اول هر ماه میلادی ساعت ۲ بامداد اجرا می‌شود
  workflow_dispatch: # دکمه اجرای دستی در گیت‌هاب

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cdsapi xarray netcdf4 scipy numpy dask

      - name: Run Fetch Script
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: python scripts/fetch_fars.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fars_temp.json
          git commit -m "Auto-update Fars climate data" || echo "No changes to commit"
          git push
